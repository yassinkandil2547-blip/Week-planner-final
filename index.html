  const todoInput = document.getElementById('todo-input');
  if(todoInput) todoInput.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); const btn = document.querySelector('[data-action="addtodo"]'); if(btn) btn.click(); }
  });
  app.querySelectorAll('[data-action="toggletodo"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const t = todos.find(x=>x.id===el.dataset.id);
      t.done = !t.done;
      animTodoId = t.id;
      saveTodos();
      render();
    });
  });
  app.querySelectorAll('[data-action="deletetodo"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      delete swipeState[el.dataset.id];
      todos = todos.filter(x=>x.id!==el.dataset.id);
      saveTodos();
      render();
    });
  });
  attachSwipeHandlers(app);

  // confirm modal
  const confirmOverlay = document.getElementById('confirmOverlay');
  if(confirmOverlay){
    confirmOverlay.addEventListener('click', (e)=>{ if(e.target===confirmOverlay && confirmModal.choices.some(c=>c.label==='Cancel')){ confirmModal=null; render(); } });
    confirmOverlay.querySelectorAll('[data-confirmchoice]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const idx = Number(el.dataset.confirmchoice);
        confirmModal.choices[idx].action();
      });
    });
  }

  // edit/add modal
  const overlay = document.getElementById('overlay');
  if(overlay){
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay){ modal=null; render(); } });

    overlay.querySelectorAll('[data-cat]').forEach(el=>{
      el.addEventListener('click', ()=>{ modal.block.category = el.dataset.cat; render(); });
    });
    overlay.querySelectorAll('[data-repday]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const day = Number(el.dataset.repday);
        const days = modal.block.days;
        const idx = days.indexOf(day);
        if(idx>=0){ if(days.length>1) days.splice(idx,1); }
        else days.push(day);
        modal.block.days = days.sort((a,b)=>a-b);
        render();
      });
    });
    overlay.querySelectorAll('[data-repeatmode]').forEach(el=>{
      el.addEventListener('click', ()=>{
        modal.repeatMode = el.dataset.repeatmode;
        if(modal.repeatMode==='once') modal.block.days = [modal.contextDay];
        else if(modal.block.days.length<1) modal.block.days = [modal.contextDay];
        render();
      });
    });
    const addSkipBtn = overlay.querySelector('[data-action="addskip"]');
    if(addSkipBtn) addSkipBtn.addEventListener('click', ()=>{
      const val = document.getElementById('f-skipdate').value;
      if(!val) return;
      if(!modal.block.skipDates) modal.block.skipDates = [];
      if(!modal.block.skipDates.includes(val)) modal.block.skipDates.push(val);
      modal.block.skipDates.sort();
      render();
    });
    overlay.querySelectorAll('[data-action="removeskip"]').forEach(el=>{
      el.addEventListener('click', ()=>{
        modal.block.skipDates = modal.block.skipDates.filter(d=>d!==el.dataset.date);
        render();
      });
    });

    const cancelBtn = overlay.querySelector('[data-action="cancel"]');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ modal=null; render(); });

    const deleteBtn = overlay.querySelector('[data-action="delete"]');
    if(deleteBtn) deleteBtn.addEventListener('click', ()=>{
      const b = modal.block;
      if(modal.originalDays.length>1){
        confirmModal = {
          title:'Delete repeating block',
          text:`"${b.title}" repeats on ${modal.originalDays.length} days. Delete just ${DAYS_FULL[modal.contextDay]}, or all of them?`,
          choices:[
            {label:`Just ${DAYS_SHORT[modal.contextDay]}`, action:()=>{
              const orig = schedule.find(x=>x.id===b.id);
              orig.days = orig.days.filter(d=>d!==modal.contextDay);
              if(orig.days.length===0) schedule = schedule.filter(x=>x.id!==b.id);
              saveSchedule(); modal=null; confirmModal=null; render();
            }},
            {label:'All days', action:()=>{
              schedule = schedule.filter(x=>x.id!==b.id);
              saveSchedule(); modal=null; confirmModal=null; render();
            }}
          ]
        };
        render();
      } else {
        schedule = schedule.filter(x=>x.id!==b.id);
        saveSchedule();
        modal = null;
        render();
      }
    });

    const saveBtn = overlay.querySelector('[data-action="save"]');
    if(saveBtn) saveBtn.addEventListener('click', ()=>{
      const titleRaw = document.getElementById('f-title').value.trim() || 'Untitled';
      const title = titleRaw.slice(0,120);
      const start = hhmmToMins(document.getElementById('f-start').value || '00:00');
      let end = hhmmToMins(document.getElementById('f-end').value || '00:00');
      if(end<=start) end = 1440;
      const skipDates = modal.block.skipDates || [];
      const newDays = (modal.repeatMode==='once' ? [modal.contextDay] : modal.block.days.slice()).sort((a,b)=>a-b);
      const origDays = modal.originalDays.slice().sort((a,b)=>a-b);
      const daysChanged = JSON.stringify(newDays) !== JSON.stringify(origDays);

      if(modal.mode==='add'){
        schedule.push({id:modal.block.id, days:newDays, start, end, title, category:modal.block.category, note:null, skipDates});
        saveSchedule(); modal=null; render(); return;
      }

      if(daysChanged || origDays.length<=1){
        const orig = schedule.find(x=>x.id===modal.block.id);
        orig.days = newDays; orig.start=start; orig.end=end; orig.title=title; orig.category=modal.block.category; orig.skipDates=skipDates;
        saveSchedule(); modal=null; render(); return;
      }

      // shared recurring block, fields changed, days unchanged -> ask scope
      confirmModal = {
        title:'Apply changes',
        text:`"${modal.block.title}" repeats on ${origDays.length} days. Apply this change to just ${DAYS_FULL[modal.contextDay]}, or all of them?`,
        choices:[
          {label:`Just ${DAYS_SHORT[modal.contextDay]}`, action:()=>{
            const orig = schedule.find(x=>x.id===modal.block.id);
            orig.days = orig.days.filter(d=>d!==modal.contextDay);
            schedule.push({id:uid(), days:[modal.contextDay], start, end, title, category:modal.block.category, note:null, skipDates});
            saveSchedule(); modal=null; confirmModal=null; render();
          }},
          {label:'All days', action:()=>{
            const orig = schedule.find(x=>x.id===modal.block.id);
            orig.start=start; orig.end=end; orig.title=title; orig.category=modal.block.category; orig.skipDates=skipDates;
            saveSchedule(); modal=null; confirmModal=null; render();
          }}
        ]
      };
      render();
    });
  }


  const schoolOverlay=document.getElementById('schoolOverlay');
  if(schoolOverlay){
    schoolOverlay.addEventListener('click',e=>{if(e.target===schoolOverlay){schoolModal=null;render();}});
    schoolOverlay.querySelectorAll('[data-schoolcolor]').forEach(el=>el.addEventListener('click',()=>{schoolModal.entry.color=el.dataset.schoolcolor;render();}));
    schoolOverlay.querySelectorAll('[data-srepeat]').forEach(el=>el.addEventListener('click',()=>{
      schoolModal.entry.repeat=el.dataset.srepeat==='weekly';
      if(schoolModal.entry.repeat && (!schoolModal.entry.days||!schoolModal.entry.days.length)) schoolModal.entry.days=[schoolModal.entry.day];
      render();
    }));
    schoolOverlay.querySelectorAll('[data-materialrepeat]').forEach(el=>el.addEventListener('click',()=>{
      schoolMaterialRepeat=el.dataset.materialrepeat==='repeat';
      render();
    }));
    schoolOverlay.querySelectorAll('[data-srepday]').forEach(el=>el.addEventListener('click',()=>{
      const d=Number(el.dataset.srepday), days=schoolModal.entry.days||(schoolModal.entry.days=[schoolModal.entry.day]);
      const i=days.indexOf(d); if(i>=0){if(days.length>1) days.splice(i,1);} else days.push(d);
      days.sort((a,b)=>a-b); schoolModal.entry.day=days[0]; render();
    }));
    const cancel=schoolOverlay.querySelector('[data-action="cancelschool"]');
    if(cancel) cancel.addEventListener('click',()=>{schoolModal=null;render();});
    const save=schoolOverlay.querySelector('[data-action="saveschool"]');
    if(save) save.addEventListener('click',()=>{
      const oldSubject=schoolModal.entry.subject;
      const subject=(document.getElementById('sf-subject').value.trim()||'Untitled').slice(0,80);
      const material=(document.getElementById('sf-material')?.value||'').trim().slice(0,300);
      const start=hhmmToMins(document.getElementById('sf-start').value||'07:45');
      let end=hhmmToMins(document.getElementById('sf-end').value||'08:30'); if(end<=start) end=1440;
      const repeat=schoolModal.entry.repeat!==false;
      const days=(schoolModal.entry.days&&schoolModal.entry.days.length?schoolModal.entry.days:[schoolModal.entry.day]).slice().sort((a,b)=>a-b);
      const dateInput=document.getElementById('sf-date');
      if(schoolModal.mode==='add'){
        if(repeat) schoolSchedule.push({...schoolModal.entry,subject,start,end,repeat:true,days,day:days[0],date:null});
        else schoolSchedule.push({...schoolModal.entry,subject,start,end,repeat:false,days:[],day:localDateFromISO(dateInput?.value||todayISO(new Date())).getDay(),date:dateInput?.value||todayISO(new Date())});
      } else {
        const orig=schoolSchedule.find(x=>x.id===schoolModal.entry.id);
        if(orig){
          orig.subject=subject; orig.start=start; orig.end=end; orig.color=schoolModal.entry.color; orig.repeat=repeat;
          if(repeat){orig.days=days; orig.day=days[0]; orig.date=null;}
          else {orig.days=[]; orig.date=dateInput?.value||orig.date||todayISO(new Date()); orig.day=localDateFromISO(orig.date).getDay();}
        }
      }
      const previousRecord=schoolMaterialRecord(oldSubject||subject);
      if(oldSubject && oldSubject.trim().toLowerCase()!==subject.trim().toLowerCase() && schoolMaterials[oldSubject.trim().toLowerCase()]) delete schoolMaterials[oldSubject.trim().toLowerCase()];
      const onceDate=!schoolMaterialRepeat ? (previousRecord?.onceDate || nextSchoolOccurrenceDate(subject,new Date())) : null;
      setSchoolMaterial(subject,material,schoolMaterialRepeat,onceDate);
      saveSchoolSchedule(); saveSchoolMaterials(); schoolModal=null; render();
    });
    const del=schoolOverlay.querySelector('[data-action="deleteschoolmodal"]');
    if(del) del.addEventListener('click',()=>{schoolSchedule=schoolSchedule.filter(x=>x.id!==schoolModal.entry.id);saveSchoolSchedule();schoolModal=null;render();});
  }

  // habit modal
  const habitOverlay = document.getElementById('habitOverlay');
  if(habitOverlay){
    habitOverlay.addEventListener('click', (e)=>{ if(e.target===habitOverlay){ habitModal=null; render(); } });

    habitOverlay.querySelectorAll('[data-hrepday]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const day = Number(el.dataset.hrepday);
        const days = habitModal.habit.days;
        const idx = days.indexOf(day);
        if(idx>=0){ if(days.length>1) days.splice(idx,1); }
        else days.push(day);
        habitModal.habit.days = days.sort((a,b)=>a-b);
        render();
      });
    });

    const cancelHabitBtn = habitOverlay.querySelector('[data-action="cancelhabit"]');
    if(cancelHabitBtn) cancelHabitBtn.addEventListener('click', ()=>{ habitModal=null; render(); });

    const deleteHabitBtn = habitOverlay.querySelector('[data-action="deletehabit"]');
    if(deleteHabitBtn) deleteHabitBtn.addEventListener('click', ()=>{
      habits = habits.filter(x=>x.id!==habitModal.habit.id);
      saveHabits();
      habitModal = null;
      render();
    });

    const saveHabitBtn = habitOverlay.querySelector('[data-action="savehabit"]');
    if(saveHabitBtn) saveHabitBtn.addEventListener('click', ()=>{
      const title = (document.getElementById('h-title').value.trim() || 'Untitled habit').slice(0,80);
      const days = habitModal.habit.days.slice();
      if(habitModal.mode==='add'){
        habits.push({ id:habitModal.habit.id, title, days });
      } else {
        const orig = habits.find(x=>x.id===habitModal.habit.id);
        orig.title = title; orig.days = days;
      }
      saveHabits();
      habitModal = null;
      render();
    });
  }

  // export/import modal
  const dataOverlay = document.getElementById('dataOverlay');
  if(dataOverlay){
    dataOverlay.addEventListener('click', (e)=>{ if(e.target===dataOverlay){ dataModal=null; render(); } });
    const closeBtn = dataOverlay.querySelector('[data-action="closedatamodal"]');
    if(closeBtn) closeBtn.addEventListener('click', ()=>{ dataModal=null; render(); });
    const copyBtn = dataOverlay.querySelector('[data-action="copydata"]');
    if(copyBtn) copyBtn.addEventListener('click', ()=>{
      const ta = document.getElementById('data-textarea');
      ta.select();
      try{ navigator.clipboard.writeText(ta.value); }catch(e){ try{ document.execCommand('copy'); }catch(e2){} }
      copyBtn.textContent = 'Copied';
      setTimeout(()=>{ copyBtn.textContent='Copy'; },1500);
    });
    const restoreBtn = dataOverlay.querySelector('[data-action="dorestore"]');
    if(restoreBtn) restoreBtn.addEventListener('click', ()=>{
      const raw = document.getElementById('data-textarea').value.trim();
      try{
        const parsed = JSON.parse(raw);
        if(!parsed.schedule) throw new Error('missing schedule');
        schedule = parsed.schedule || [];
        schoolSchedule = parsed.schoolSchedule || defaultSchoolSchedule();
        schoolMaterials = parsed.schoolMaterials || {};
        Object.keys(schoolMaterials).forEach(k=>{ if(typeof schoolMaterials[k]==='string') schoolMaterials[k]={text:schoolMaterials[k],repeat:true,onceDate:null}; });
        completions = parsed.completions || {};
        todos = parsed.todos || [];
        todosWeekKey = parsed.todosWeekKey || weekKeyFor(new Date());
        todosHistory = parsed.todosHistory || [];
        habits = parsed.habits || [];
        habitCompletions = parsed.habitCompletions || {};
        saveSchedule(); saveSchoolSchedule(); saveSchoolMaterials(); saveCompletions(); saveTodos(); saveTodoWeekKey(); saveTodosHistory(); saveHabits(); saveHabitCompletions();
        dataModal = null;
        toastMsg = 'Backup restored';
        render();
      }catch(e){
        alert('That text does not look like a valid backup. Double-check you copied the whole thing.');
      }
    });
  }
}

/* ============================== service worker + init ============================== */

function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol === 'file:') return; // sw requires http(s)
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    reg.addEventListener('updatefound', ()=>{
      const nw = reg.installing;
      if(!nw) return;
      nw.addEventListener('statechange', ()=>{
        if(nw.state==='installed' && navigator.serviceWorker.controller){
          nw.postMessage('SKIP_WAITING');
        }
      });
    });
  }).catch(()=>{});
  let refreshed = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(refreshed) return;
    refreshed = true;
    location.reload();
  });
}

async function init(){
  await loadState();
  render();
  registerServiceWorker();
  setInterval(()=>{ if(appScreen==='main' && !modal && !confirmModal && !dataModal && !habitModal && !settingsOpen) render(); }, 15000);
}
init();
})();
</script>
